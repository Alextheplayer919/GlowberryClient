# The client version stamped into BuildConfig.VERSION_NAME.
#
# `git describe --tags` is the primary source, but a shallow CI checkout (fetch-depth: 1) has no
# tags, so the build fell back to "unknown" and the in-app diagnostics report showed
# "App version: unknown". This file is the fallback, and is also what a local build without tags
# reads, so the report always names a real version.
version.name=BETA3
