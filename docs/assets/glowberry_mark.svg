<?xml version="1.0" encoding="UTF-8"?>
<!--
    GlowberryClient brand mark: a golden glowberry (a faceted berry with a crown of sepals and a
    small leaf) on a rounded dark-purple tile. Original artwork drawn as vectors so it scales
    cleanly and carries no third-party assets. Used for the README banner and icon.
-->
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#221958"/>
      <stop offset="0.55" stop-color="#4A24A8"/>
      <stop offset="1" stop-color="#7E32AA"/>
    </linearGradient>
    <radialGradient id="berryGlow" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#FFE9A0"/>
      <stop offset="0.45" stop-color="#FFC94D"/>
      <stop offset="1" stop-color="#E8890C"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7BE495"/>
      <stop offset="1" stop-color="#2FA85A"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- Rounded tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#tile)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="3"/>

  <!-- Glow behind the berry -->
  <circle cx="256" cy="286" r="150" fill="#FFC94D" opacity="0.20" filter="url(#soft)"/>

  <!-- Berry body: a rounded faceted cluster -->
  <g>
    <!-- main body -->
    <path d="M256 150
             C 330 150, 388 214, 388 292
             C 388 366, 330 418, 256 418
             C 182 418, 124 366, 124 292
             C 124 214, 182 150, 256 150 Z"
          fill="url(#berryGlow)"/>
    <!-- facet highlights: three beads that read as the glowberry's lobes -->
    <ellipse cx="214" cy="244" rx="34" ry="42" fill="#FFE9A0" opacity="0.55"/>
    <ellipse cx="300" cy="266" rx="30" ry="38" fill="#FFD873" opacity="0.45"/>
    <ellipse cx="256" cy="336" rx="44" ry="40" fill="#FFB020" opacity="0.35"/>
    <!-- specular -->
    <ellipse cx="206" cy="220" rx="16" ry="22" fill="#FFFFFF" opacity="0.55"/>
  </g>

  <!-- Sepal crown: five small pointed leaves at the top -->
  <g fill="#2FA85A">
    <path d="M256 150 L238 96 L256 128 L274 96 Z"/>
    <path d="M256 150 L196 108 L224 140 Z" opacity="0.92"/>
    <path d="M256 150 L316 108 L288 140 Z" opacity="0.92"/>
  </g>

  <!-- Small leaf on a stem -->
  <path d="M256 150 C 250 122, 262 104, 292 96 C 296 124, 284 146, 256 150 Z"
        fill="url(#leaf)"/>
  <path d="M256 150 C 250 122, 262 104, 292 96" fill="none"
        stroke="#1F7A40" stroke-width="4" stroke-linecap="round"/>
  <path d="M262 132 L282 112" stroke="#1F7A40" stroke-width="3" stroke-linecap="round"/>

  <!-- Subtle inner rim on the tile -->
  <rect x="40" y="40" width="432" height="432" rx="92" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="2"/>
</svg>
