<?xml version="1.0" encoding="UTF-8"?>
<!--
    GlowberryClient README banner: the glowberry mark on a dark-purple gradient with the product
    wordmark and a one-line tagline. Original vector artwork, no third-party assets.
-->
<svg width="1280" height="360" viewBox="0 0 1280 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140F2E"/>
      <stop offset="0.5" stop-color="#221958"/>
      <stop offset="1" stop-color="#4A24A8"/>
    </linearGradient>
    <radialGradient id="berryGlow" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#FFE9A0"/>
      <stop offset="0.45" stop-color="#FFC94D"/>
      <stop offset="1" stop-color="#E8890C"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7BE495"/>
      <stop offset="1" stop-color="#2FA85A"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFC94D"/>
      <stop offset="1" stop-color="#FFC94D" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <!-- faint diagonal sheen -->
  <path d="M0 360 L520 0 L760 0 L240 360 Z" fill="#FFFFFF" opacity="0.03"/>

  <!-- Mark on the left -->
  <g transform="translate(64,64) scale(0.45)">
    <rect x="16" y="16" width="480" height="480" rx="112" fill="#000000" opacity="0.25"/>
    <circle cx="256" cy="286" r="150" fill="#FFC94D" opacity="0.22" filter="url(#soft)"/>
    <path d="M256 150 C 330 150, 388 214, 388 292 C 388 366, 330 418, 256 418
             C 182 418, 124 366, 124 292 C 124 214, 182 150, 256 150 Z"
          fill="url(#berryGlow)"/>
    <ellipse cx="214" cy="244" rx="34" ry="42" fill="#FFE9A0" opacity="0.55"/>
    <ellipse cx="300" cy="266" rx="30" ry="38" fill="#FFD873" opacity="0.45"/>
    <ellipse cx="256" cy="336" rx="44" ry="40" fill="#FFB020" opacity="0.35"/>
    <ellipse cx="206" cy="220" rx="16" ry="22" fill="#FFFFFF" opacity="0.55"/>
    <g fill="#2FA85A">
      <path d="M256 150 L238 96 L256 128 L274 96 Z"/>
      <path d="M256 150 L196 108 L224 140 Z" opacity="0.92"/>
      <path d="M256 150 L316 108 L288 140 Z" opacity="0.92"/>
    </g>
    <path d="M256 150 C 250 122, 262 104, 292 96 C 296 124, 284 146, 256 150 Z" fill="url(#leaf)"/>
    <path d="M256 150 C 250 122, 262 104, 292 96" fill="none" stroke="#1F7A40"
          stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <text x="360" y="178" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="92" font-weight="700" fill="#FFFFFF">Glowberry<tspan fill="#FFC94D">Client</tspan></text>
  <rect x="364" y="206" width="300" height="4" rx="2" fill="url(#rule)"/>
  <text x="362" y="256" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="30" font-weight="500" fill="#CDBEF0">Android launcher for Minecraft: Bedrock Edition</text>
  <text x="362" y="296" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="24" font-weight="400" fill="#9C8FD0">Multi-version instances · Native modding · Custom UI</text>
</svg>
